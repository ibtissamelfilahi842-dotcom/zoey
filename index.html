<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Image - No Crop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* لون الخلفية للفراغات */
        }

        body {
            background-image: url('https://github.com/ibtissamelfilahi842-dotcom/zoey/blob/main/63f2ce71-2f2b-47c8-adf4-7991193b40cc.png?raw=true');
            background-size: contain;     /* احتواء الصورة بالكامل دون قص */
            background-position: center;  /* توسيط الصورة */
            background-repeat: no-repeat; /* عدم تكرار الصورة */
        }
    </style>
