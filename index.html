  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .card {
      background: #fff;
      width: 90%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #667eea;
    }
    h1 { margin: 16px 0 20px; font-size: 24px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .note { margin: 10px 0 0; font-size: 12px; color: #777; }
  </style>
</head>

<body>
  <div class="card">
    <img class="avatar" src="https://images.unsplash.com/photo-1583900985737-6d0495555783?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Profile">
    <h1>Ava Zoey</h1>

    <form id="emailForm">
      <input type="email" name="email" placeholder="your@email.com" required>
      <button type="submit" id="btn">Contact me</button>
    
    </form>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbx_gNkGNiZldfE4DuL-E9D9717RHQGnF03bHy_v8U_E1drOMvPQbFu8l2KVUP-FVLIqIA/exec";
    const redirectURL = "https://t.camsk5.com/343986/2994/31233?po=6533&aff_sub5=SF_006OG000004lmDN";

    const form = document.getElementById("emailForm");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "...";
      try {
        await fetch(scriptURL, {
          method: "POST",
          body: new FormData(form),
          mode: "no-cors"
        });
      } catch (err) {
        // نكمل التحويل حتى لو فشل الحفظ
      }
      window.location.href = redirectURL;
    });
  </script>
</body>
