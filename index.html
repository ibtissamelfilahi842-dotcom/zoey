<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>11:00</title>

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="11:00">
  <meta name="twitter:image" content="https://avazoey.online/card11.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="11:00">
  <meta property="og:image" content="https://avazoey.online/card11.png">
  <meta property="og:image:secure_url" content="https://avazoey.online/card11.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="837">
  <meta property="og:url" content="https://avazoey.online/?r=31">

  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#f1f3f5;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#111}
    .card{width:92%;max-width:380px;background:#fff;border-radius:18px;padding:32px 24px;
      text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#229ED9;
      color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    h1{margin:0 0 4px;font-size:22px}
    .subs{color:#8a8f98;font-size:14px;margin-bottom:14px}
    .desc{font-size:15px;line-height:1.5;color:#444;margin-bottom:24px}
    .btn{display:block;background:#229ED9;color:#fff;text-decoration:none;font-weight:600;
      font-size:17px;padding:14px;border-radius:12px}
    .btn:active{opacity:.85}
    .tip{margin:14px 0 0;font-size:13px;color:#8a8f98;line-height:1.5}
  </style>
</head>

<body>
  <div class="card">
    <img id="avatar" class="avatar" alt="">
    <h1 id="name"></h1>
    <div class="subs" id="subs"></div>
    <div class="desc" id="desc"></div>
    <a id="btn" class="btn" href="https://t.me/avazoey">View in Telegram</a>
    <p class="tip">If Telegram does not open: tap the ⋯ menu then "Open in Browser".</p>
  </div>

  <script>
    // ====== عدّل هذه القيم فقط ======
    var CHANNEL = {
      user: "avazoey",
      name: "Ava Zoey fans😍",
      subs: "",
      desc: "waiting for you 😍",
      avatar: "https://images.unsplash.com/photo-1583900985737-6d0495555783?w=600&auto=format&fit=crop&q=60"
    };
    // =================================

    document.getElementById("name").textContent = CHANNEL.name;
    document.getElementById("subs").textContent = CHANNEL.subs;
    document.getElementById("desc").textContent = CHANNEL.desc;

    var btn = document.getElementById("btn");
    var web = "https://t.me/" + CHANNEL.user;

    // الافتراضي (iPhone + الكمبيوتر): رابط https عادي
    btn.href = web;

    // أندرويد فقط: intent بدون package
    if (/Android/i.test(navigator.userAgent)) {
      btn.href = "intent://resolve?domain=" + CHANNEL.user +
        "#Intent;scheme=tg;S.browser_fallback_url=" +
        encodeURIComponent(web) + ";end";
    }

    var img = document.getElementById("avatar");
    img.onerror = function () {
      var d = document.createElement("div");
      d.className = "avatar";
      d.textContent = CHANNEL.name.charAt(0);
      img.replaceWith(d);
    };
    img.src = CHANNEL.avatar;
  </script>

  <noscript>
    <a href="https://t.me/avazoey">Continue</a>
  </noscript>
</body>
</html>
