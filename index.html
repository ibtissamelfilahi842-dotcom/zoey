  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#f1f3f5;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#111}
    #loading{font-size:16px;color:#555}

    /* Popup */
    #ob{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);
      align-items:center;justify-content:center;padding:20px}
    #ob.show{display:flex}
    .ob-box{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:24px 20px 16px;
      text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
    .ob-box h2{margin:0 0 8px;font-size:19px}
    .ob-box p{margin:0 0 16px;font-size:15px;line-height:1.5;color:#444}
    .ob-steps{background:#f1f3f5;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;
      text-align:left;margin-bottom:16px}
    .ob-row{display:flex;gap:10px}
    .ob-btn{flex:1;display:block;border:0;border-radius:12px;padding:13px;font-size:16px;
      font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
    .ob-cancel{background:#e9ecef;color:#222}
    .ob-open{background:#229ED9;color:#fff}
    .ob-copy{margin-top:10px;background:none;border:0;color:#8a8f98;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <p id="loading">Opening...</p>

  <div id="ob">
    <div class="ob-box">
      <h2 id="ob-title">Open in browser</h2>
      <p>Open this page in your phone's browser to continue.</p>
      <div class="ob-steps" id="ob-steps"></div>
      <div class="ob-row">
        <button class="ob-btn ob-cancel" id="ob-cancel">Cancel</button>
        <a class="ob-btn ob-open" id="ob-open" href="#">Open</a>
      </div>
      <button class="ob-copy" id="ob-copy">Copy link</button>
    </div>
  </div>

  <noscript>
    <a href="https://t.camsk5.com/343986/2994/31233?po=6533&aff_sub5=SF_006OG000004lmDN">Continue</a>
  </noscript>

  <script>
    var TARGET = "https://t.camsk5.com/343986/2994/31233?po=6533&aff_sub5=SF_006OG000004lmDN";
    var PAGE   = location.href;

    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    // In-app browser detection (X, Facebook, Instagram, generic WebView)
    var iosInApp = isIOS && (!/Safari/i.test(ua) || /Twitter|FBAN|FBAV|Instagram|Line/i.test(ua));
    var androidInApp = isAndroid && /Twitter|FBAN|FBAV|Instagram|; wv\)/i.test(ua);
    var inApp = iosInApp || androidInApp;

    if (!inApp) {
      // Normal browser (Safari / Chrome / Samsung Internet / desktop): redirect
      window.addEventListener("load", function () {
        setTimeout(function () { window.location.href = TARGET; }, 1200);
      });
    } else {
      showPopup();
    }

    function showPopup() {
      var ob = document.getElementById("ob");
      var openBtn = document.getElementById("ob-open");
      var name = isIOS ? "Safari" : "your browser";

      document.getElementById("ob-title").textContent = isIOS ? "Open in Safari" : "Open in browser";
      document.getElementById("ob-steps").innerHTML =
        "Tap <b>Open</b>. If nothing happens:<br>" +
        "1. Tap the <b>⋯</b> or <b>share</b> icon<br>" +
        "2. Choose <b>Open in " + name + "</b>";

      var noScheme = PAGE.replace(/^https?:\/\//, "");
      var androidIntent = "intent://" + noScheme +
        "#Intent;scheme=https;action=android.intent.action.VIEW;end";
      var androidChrome = "intent://" + noScheme +
        "#Intent;scheme=https;package=com.android.chrome;end";
      var androidSamsung = "intent://" + noScheme +
        "#Intent;scheme=https;package=com.sec.android.app.sbrowser;end";

      openBtn.href = PAGE;
      openBtn.onclick = function (e) {
        e.preventDefault();
        if (isAndroid) {
          // 1) default browser, 2) Samsung Internet, 3) Chrome
          window.location.href = androidIntent;
          setTimeout(function () { window.location.href = androidSamsung; }, 700);
          setTimeout(function () { window.location.href = androidChrome; }, 1400);
        } else if (isIOS) {
          // 1) new-tab request (may trigger the native "Open in Safari?" prompt)
          var w = window.open(PAGE, "_blank");
          // 2) Safari scheme, 3) Chrome iOS scheme (only if Chrome is installed)
          setTimeout(function () { window.location.href = "x-safari-" + PAGE; }, 500);
          setTimeout(function () {
            window.location.href = "googlechrome://" + noScheme;
          }, 1000);
        }
      };

      setTimeout(function () { ob.classList.add("show"); }, 500);

      document.getElementById("ob-cancel").onclick = function () {
        ob.classList.remove("show");
      };

      document.getElementById("ob-copy").onclick = function () {
        var b = this;
        function done() { b.textContent = "Copied ✓"; }
        function fallback() {
          var t = document.createElement("textarea");
          t.value = PAGE; document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); done(); } catch (e) {}
          document.body.removeChild(t);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(PAGE).then(done, fallback);
        } else { fallback(); }
      };
    }
  </script>
</body>
